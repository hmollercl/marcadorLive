<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcador Basketball</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #13131a;
    --border: #2a2a3a;
    --text-dim: #555570;
    --text-mid: #9090b0;
    --text-bright: #ffffff;
    --accent: #e8c84a;
    --foul-color: #e05a2b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── CAMERA ── */
  #camera {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    background: #000;
  }

  #cam-error {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #0a0a0f;
    color: var(--text-mid);
    font-size: 0.9rem;
    text-align: center;
    padding: 24px;
  }
  #cam-error .icon { font-size: 2.5rem; }

  /* ── OVERLAY BAR ── */
  #overlay-bar {
    position: fixed;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: stretch;
    height: clamp(52px, 10vh, 72px);
    transition: top 0.25s ease, bottom 0.25s ease;
  }
  #overlay-bar.pos-bottom { bottom: env(safe-area-inset-bottom, 0px); top: auto; }
  #overlay-bar.pos-top    { top: env(safe-area-inset-top, 0px); bottom: auto; }

  /* Team blocks */
  .ob-team {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0;
    overflow: hidden;
  }
  .ob-team.left  { flex-direction: row; }
  .ob-team.right { flex-direction: row-reverse; }

  .ob-color-stripe {
    width: 6px;
    height: 100%;
    flex-shrink: 0;
  }

  .ob-team-inner {
    flex: 1;
    display: flex;
    align-items: center;
    background: rgba(10,10,15,0.88);
    height: 100%;
    padding: 0 12px;
    gap: 10px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .ob-team.right .ob-team-inner { flex-direction: row-reverse; }

  .ob-name {
    font-size: clamp(0.85rem, 3.2vw, 1.25rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .ob-team.right .ob-name { text-align: right; }

  .ob-foul-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
    opacity: 0.9;
  }
  .ob-foul-num {
    font-size: clamp(1rem, 3.5vw, 1.5rem);
    font-weight: 900;
    color: var(--foul-color);
  }
  .ob-foul-lbl {
    font-size: clamp(0.45rem, 1.4vw, 0.6rem);
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .ob-score {
    font-size: clamp(1.8rem, 7vw, 3rem);
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    min-width: 2ch;
    text-align: center;
  }

  /* Center block */
  .ob-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(20,20,35,0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 0 14px;
    height: 100%;
    flex-shrink: 0;
  }
  .ob-period-num {
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }
  .ob-period-lbl {
    font-size: clamp(0.5rem, 1.6vw, 0.68rem);
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ── CONTROLS PANEL ── */
  #controls-panel {
    position: fixed;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    gap: 1px;
    background: var(--border);
    transition: top 0.25s ease, bottom 0.25s ease;
  }
  #controls-panel.pos-bottom {
    /* overlay on bottom → controls on top */
    top: env(safe-area-inset-top, 0px);
    bottom: auto;
  }
  #controls-panel.pos-top {
    /* overlay on top → controls on bottom */
    bottom: env(safe-area-inset-bottom, 0px);
    top: auto;
  }

  .team-ctrl {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
  }

  .ctrl-row {
    display: flex;
    flex: 1;
    gap: 1px;
  }

  .btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(19,19,26,0.96);
    border: none;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.55rem, 1.8vw, 0.8rem);
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    gap: 1px;
    padding: 6px 2px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 0.08s;
  }
  .btn:active { background: #222230; }

  .btn .bv {
    font-size: clamp(1rem, 4vw, 1.9rem);
    font-weight: 900;
    line-height: 1;
  }
  .btn.s-add .bv { color: #6ee86e; }
  .btn.s-sub .bv { color: #e86e6e; }
  .btn.f-add .bv { color: var(--foul-color); }
  .btn.f-sub .bv { color: var(--text-mid); }

  .center-ctrl {
    flex: 0 0 clamp(64px, 16vw, 110px);
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
  }

  .btn-c {
    flex: 1;
    background: rgba(26,26,40,0.97);
    border: none;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.55rem, 1.6vw, 0.75rem);
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 0.08s;
  }
  .btn-c:active { background: #222230; }
  .btn-c .ar { font-size: clamp(0.9rem, 2.8vw, 1.4rem); }
  .btn-c.move { color: var(--accent); }
  .btn-c.rst  { color: var(--text-dim); font-size: clamp(0.5rem, 1.4vw, 0.65rem); }
  .btn-c.rst:active { color: #e86e6e; }

  /* ── MODAL ── */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  #modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    width: min(320px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #modal h2 {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group label {
    font-size: 0.7rem;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .field-group input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    font-size: 1rem;
    padding: 8px 12px;
    outline: none;
    width: 100%;
  }
  .field-group input[type="text"]:focus { border-color: var(--accent); }

  .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: border-color 0.12s, transform 0.1s;
  }
  .color-swatch:active { transform: scale(0.88); }
  .color-swatch.selected { border-color: #fff; }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 8px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }
  .modal-btn.cancel { background: var(--border); color: var(--text-mid); }
  .modal-btn.save   { background: var(--accent); color: #000; }
</style>
</head>
<body>

<!-- CAMERA -->
<video id="camera" autoplay playsinline muted></video>
<div id="cam-error">
  <div class="icon">📷</div>
  <div id="cam-error-msg">Iniciando cámara…</div>
</div>

<!-- OVERLAY BAR -->
<div id="overlay-bar" class="pos-bottom">
  <!-- Team A -->
  <div class="ob-team left" id="ob-team-a" onclick="openModal('a')">
    <div class="ob-color-stripe" id="ob-stripe-a"></div>
    <div class="ob-team-inner">
      <div class="ob-name" id="ob-name-a">LOCAL</div>
      <div class="ob-foul-badge">
        <div class="ob-foul-num" id="ob-foul-a">0</div>
        <div class="ob-foul-lbl">faltas</div>
      </div>
      <div class="ob-score" id="ob-score-a">0</div>
    </div>
  </div>

  <!-- Center -->
  <div class="ob-center">
    <div class="ob-period-num" id="ob-period">1</div>
    <div class="ob-period-lbl" id="ob-period-lbl">1° CTO</div>
  </div>

  <!-- Team B -->
  <div class="ob-team right" id="ob-team-b" onclick="openModal('b')">
    <div class="ob-color-stripe" id="ob-stripe-b"></div>
    <div class="ob-team-inner">
      <div class="ob-name" id="ob-name-b">VISITA</div>
      <div class="ob-foul-badge">
        <div class="ob-foul-num" id="ob-foul-b">0</div>
        <div class="ob-foul-lbl">faltas</div>
      </div>
      <div class="ob-score" id="ob-score-b">0</div>
    </div>
  </div>
</div>

<!-- CONTROLS PANEL -->
<div id="controls-panel" class="pos-bottom">
  <!-- Team A controls -->
  <div class="team-ctrl">
    <div class="ctrl-row">
      <button class="btn s-sub" onclick="addScore('a',-1)"><span class="bv">−1</span><span>pto</span></button>
      <button class="btn s-add" onclick="addScore('a',1)"><span class="bv">+1</span><span>pto</span></button>
      <button class="btn s-add" onclick="addScore('a',2)"><span class="bv">+2</span><span>ptos</span></button>
      <button class="btn s-add" onclick="addScore('a',3)"><span class="bv">+3</span><span>ptos</span></button>
    </div>
    <div class="ctrl-row">
      <button class="btn f-sub" onclick="addFoul('a',-1)"><span class="bv">−</span><span>falta</span></button>
      <button class="btn f-add" onclick="addFoul('a',1)"><span class="bv">+</span><span>falta</span></button>
    </div>
  </div>

  <!-- Center controls -->
  <div class="center-ctrl">
    <button class="btn-c" onclick="changePeriod(1)"><span class="ar">▲</span><span>Per.</span></button>
    <button class="btn-c" onclick="changePeriod(-1)"><span class="ar">▼</span><span>Per.</span></button>
    <button class="btn-c move" onclick="togglePosition()">⇅ mover</button>
    <button class="btn-c rst" onclick="confirmReset()">↺ reset</button>
  </div>

  <!-- Team B controls -->
  <div class="team-ctrl">
    <div class="ctrl-row">
      <button class="btn s-add" onclick="addScore('b',3)"><span class="bv">+3</span><span>ptos</span></button>
      <button class="btn s-add" onclick="addScore('b',2)"><span class="bv">+2</span><span>ptos</span></button>
      <button class="btn s-add" onclick="addScore('b',1)"><span class="bv">+1</span><span>pto</span></button>
      <button class="btn s-sub" onclick="addScore('b',-1)"><span class="bv">−1</span><span>pto</span></button>
    </div>
    <div class="ctrl-row">
      <button class="btn f-add" onclick="addFoul('b',1)"><span class="bv">+</span><span>falta</span></button>
      <button class="btn f-sub" onclick="addFoul('b',-1)"><span class="bv">−</span><span>falta</span></button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">Editar equipo</h2>
    <div class="field-group">
      <label>Nombre del equipo</label>
      <input type="text" id="modal-name" maxlength="20" placeholder="Nombre">
    </div>
    <div class="field-group">
      <label>Color del uniforme</label>
      <div class="color-row" id="color-swatches"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn save" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<script>
const COLORS = [
  '#ffffff','#e03030','#2060e0','#20a040',
  '#e8c020','#e07020','#444460','#8040c0',
  '#40a8e0','#e060a0','#00b894','#d63031'
];
const PERIOD_LABELS = ['1° CTO','2° CTO','3° CTO','4° CTO','PRÓRR 1','PRÓRR 2'];

const state = {
  a: { score:0, fouls:0, name:'LOCAL',  color:'#2060e0' },
  b: { score:0, fouls:0, name:'VISITA', color:'#e03030' },
  period: 1,
  overlayPos: 'bottom' // 'bottom' | 'top'
};

let modalTeam = null;

// ── CAMERA ──
async function startCamera() {
  const video = document.getElementById('camera');
  const errDiv = document.getElementById('cam-error');
  const errMsg = document.getElementById('cam-error-msg');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    errDiv.style.display = 'none';
  } catch(e) {
    video.style.display = 'none';
    errDiv.style.display = 'flex';
    if (e.name === 'NotAllowedError') {
      errMsg.textContent = 'Permiso de cámara denegado. Habilitá el acceso en ajustes del navegador.';
    } else if (e.name === 'NotFoundError') {
      errMsg.textContent = 'No se encontró cámara. Conectá una cámara e intentá de nuevo.';
    } else {
      errMsg.textContent = 'Error al iniciar la cámara: ' + e.message;
    }
  }
}

// ── LAYOUT: controls height → overlay positioning ──
function applyLayout() {
  const ctrlPanel = document.getElementById('controls-panel');
  const overlayBar = document.getElementById('overlay-bar');

  // Reset
  ctrlPanel.classList.remove('pos-bottom','pos-top');
  overlayBar.classList.remove('pos-bottom','pos-top');

  // Get controls height after render
  requestAnimationFrame(() => {
    const ctrlH = ctrlPanel.offsetHeight;
    const barH  = overlayBar.offsetHeight;

    if (state.overlayPos === 'bottom') {
      overlayBar.style.bottom = 'env(safe-area-inset-bottom, 0px)';
      overlayBar.style.top    = '';
      ctrlPanel.style.top    = 'env(safe-area-inset-top, 0px)';
      ctrlPanel.style.bottom = '';
    } else {
      overlayBar.style.top    = 'env(safe-area-inset-top, 0px)';
      overlayBar.style.bottom = '';
      ctrlPanel.style.bottom = 'env(safe-area-inset-bottom, 0px)';
      ctrlPanel.style.top    = '';
    }
  });
}

function togglePosition() {
  state.overlayPos = state.overlayPos === 'bottom' ? 'top' : 'bottom';
  applyLayout();
}

// ── STATE ──
function clamp(v,mn,mx){ return Math.max(mn,Math.min(mx,v)); }

function addScore(t,d){ state[t].score = clamp(state[t].score+d,0,999); render(); }
function addFoul(t,d) { state[t].fouls = clamp(state[t].fouls+d,0,20);  render(); }

function changePeriod(d){
  state.period = clamp(state.period+d,1,6);
  render();
}

function confirmReset(){
  if(confirm('¿Resetear marcador y faltas?')){
    state.a.score=0; state.b.score=0;
    state.a.fouls=0; state.b.fouls=0;
    render();
  }
}

function render(){
  ['a','b'].forEach(t => {
    document.getElementById('ob-score-'+t).textContent = state[t].score;
    document.getElementById('ob-foul-'+t).textContent  = state[t].fouls;
    document.getElementById('ob-name-'+t).textContent  = state[t].name.toUpperCase();
    document.getElementById('ob-stripe-'+t).style.background = state[t].color;
  });
  const p = state.period;
  document.getElementById('ob-period').textContent    = p;
  document.getElementById('ob-period-lbl').textContent = PERIOD_LABELS[p-1] || ('PRÓRR '+(p-4));
}

// ── MODAL ──
function buildSwatches(sel){
  const c = document.getElementById('color-swatches');
  c.innerHTML='';
  COLORS.forEach(hex => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (hex===sel?' selected':'');
    sw.style.background = hex;
    sw.onclick = () => {
      c.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
    };
    c.appendChild(sw);
  });
}

function openModal(t){
  modalTeam=t;
  document.getElementById('modal-title').textContent =
    t==='a' ? 'Editar Equipo Local' : 'Editar Equipo Visita';
  document.getElementById('modal-name').value = state[t].name;
  buildSwatches(state[t].color);
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('modal-name').focus(),100);
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  modalTeam=null;
}

function rgbToHex(str){
  const m=str.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if(!m) return str;
  return '#'+[m[1],m[2],m[3]].map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');
}

function saveModal(){
  if(!modalTeam) return;
  const name = document.getElementById('modal-name').value.trim();
  if(name) state[modalTeam].name = name;
  const sel = document.querySelector('.color-swatch.selected');
  if(sel) state[modalTeam].color = rgbToHex(sel.style.background)||state[modalTeam].color;
  closeModal();
  render();
}

document.getElementById('modal-overlay').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});
document.getElementById('modal-name').addEventListener('keydown',e=>{
  if(e.key==='Enter') saveModal();
});

// ── INIT ──
startCamera();
render();
applyLayout();
</script>
</body>
</html>

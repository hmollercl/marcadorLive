<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcador Basketball</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #13131a;
    --border: #2a2a3a;
    --text-dim: #555570;
    --text-mid: #9090b0;
    --accent: #e8c84a;
    --foul-color: #e05a2b;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── CAMERA ── */
  #camera {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  #cam-error {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #0a0a0f;
    color: var(--text-mid);
    font-size: 0.9rem;
    text-align: center;
    padding: 24px;
  }
  #cam-error .icon { font-size: 2.5rem; }

  /* ── TOUCH ZONES (full screen, split top/bottom) ── */
  #touch-top, #touch-bottom {
    position: fixed;
    left: 0; right: 0;
    z-index: 5;
    /* each half */
  }
  #touch-top    { top: 0; height: 50%; }
  #touch-bottom { top: 50%; height: 50%; }

  /* ── OVERLAY BAR ── */
  #overlay-bar {
    position: fixed;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: stretch;
    height: clamp(56px, 12vh, 80px);
    /* default bottom */
    bottom: env(safe-area-inset-bottom, 0px);
  }
  #overlay-bar.pos-top {
    bottom: auto;
    top: env(safe-area-inset-top, 0px);
  }


  .flash-up, .flash-down {
    position: fixed;
    left: 0; right: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .flash-up   { top: 0;   height: 50%; background: rgba(110,232,110,0.07); }
  .flash-down { top: 50%; height: 50%; background: rgba(232,110,110,0.07); }
  .flash-up.show, .flash-down.show { opacity: 1; }

  /* Segments within overlay */
  .ob-seg {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: rgba(10,10,15,0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    position: relative;
    overflow: hidden;
  }

  /* color stripe top */
  .ob-seg::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  #seg-local::before  { background: var(--color-a, #2060e0); }
  #seg-visit::before  { background: var(--color-b, #e03030); }

  /* Faltas */
  .ob-seg.foul {
    flex: 0 0 clamp(44px, 10vw, 72px);
    gap: 2px;
    cursor: pointer;
  }
  .foul-num {
    font-size: clamp(1.3rem, 5vw, 2.4rem);
    font-weight: 900;
    color: var(--foul-color);
    line-height: 1;
  }
  .foul-lbl {
    font-size: clamp(0.4rem, 1.3vw, 0.58rem);
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  /* up/down arrows on foul */
  .foul-arrows {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
    font-size: clamp(0.5rem, 1.6vw, 0.7rem);
    color: var(--text-dim);
  }

  /* Name */
  .ob-seg.name {
    flex: 1;
    cursor: pointer;
    padding: 0 8px;
  }
  .name-text {
    font-size: clamp(0.75rem, 3vw, 1.3rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .name-hint {
    font-size: clamp(0.4rem, 1.2vw, 0.55rem);
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  /* Score */
  .ob-seg.score {
    flex: 0 0 clamp(60px, 14vw, 100px);
  }
  .score-num {
    font-size: clamp(2rem, 9vw, 4.5rem);
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .score-hint {
    display: flex;
    gap: 6px;
    font-size: clamp(0.4rem, 1.2vw, 0.55rem);
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  /* Period */
  .ob-seg.period {
    flex: 0 0 clamp(52px, 12vw, 84px);
    background: rgba(20,20,35,0.92);
    gap: 0;
  }
  .period-num {
    font-size: clamp(1.8rem, 7vw, 3.5rem);
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }
  .period-lbl {
    font-size: clamp(0.4rem, 1.3vw, 0.6rem);
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .period-hint {
    font-size: clamp(0.38rem, 1.1vw, 0.52rem);
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* Dividers */
  .ob-div {
    width: 1px;
    background: var(--border);
    flex-shrink: 0;
    align-self: stretch;
  }

  /* ── MOVE / FULLSCREEN buttons (discrete, overlay on camera) ── */
  #ui-btns {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    z-index: 20;
    display: flex;
    gap: 6px;
  }
  .ui-btn {
    background: rgba(10,10,15,0.7);
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .ui-btn:active { background: rgba(40,40,60,0.9); }
  #ui-btns.hidden { display: none; }

  /* ── MODAL ── */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  #modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    width: min(320px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #modal h2 {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group label {
    font-size: 0.7rem;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .field-group input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    font-size: 1rem;
    padding: 8px 12px;
    outline: none;
    width: 100%;
  }
  .field-group input[type="text"]:focus { border-color: var(--accent); }
  .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: border-color 0.12s, transform 0.1s;
  }
  .color-swatch:active { transform: scale(0.88); }
  .color-swatch.selected { border-color: #fff; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 8px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }
  .modal-btn.cancel { background: var(--border); color: var(--text-mid); }
  .modal-btn.save   { background: var(--accent); color: #000; }

  /* reset button in modal */
  .modal-reset {
    font-size: 0.7rem;
    color: var(--foul-color);
    text-decoration: underline;
    cursor: pointer;
    text-align: left;
    background: none;
    border: none;
    font-family: 'Barlow', sans-serif;
    padding: 0;
  }
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<div id="cam-error">
  <div class="icon">📷</div>
  <div id="cam-error-msg">Iniciando cámara…</div>
</div>

<!-- Touch zones -->
<div id="touch-top"></div>
<div id="touch-bottom"></div>

<!-- Discrete UI buttons -->
<div id="ui-btns">
  <button class="ui-btn" onclick="togglePosition()">⇅ mover</button>
  <button class="ui-btn" onclick="toggleFullscreen()">⤢ pantalla</button>
  <button class="ui-btn" onclick="confirmReset()" style="color:var(--foul-color)">↺ reset</button>
</div>

<!-- OVERLAY BAR -->
<div id="overlay-bar">
  <!-- Faltas Local -->
  <div class="ob-seg foul" id="seg-foul-a">
    <div class="foul-num" id="foul-a">0</div>
    <div class="foul-lbl">faltas</div>
    <div class="foul-arrows"><span>▲</span><span>▼</span></div>
  </div>
  <div class="ob-div"></div>

  <!-- Nombre Local -->
  <div class="ob-seg name" id="seg-local">
    <div class="name-text" id="name-a">LOCAL</div>
    <div class="name-hint">mantén presionado para editar</div>
  </div>
  <div class="ob-div"></div>

  <!-- Score Local -->
  <div class="ob-seg score" id="seg-score-a">
    <div class="score-num" id="score-a">0</div>
    <div class="score-hint"><span>▲ sube</span><span>▼ baja</span></div>
  </div>
  <div class="ob-div"></div>

  <!-- Período -->
  <div class="ob-seg period" id="seg-period">
    <div class="period-num" id="period-num">1</div>
    <div class="period-lbl" id="period-lbl">1° CTO</div>
    <div class="period-hint">▲▼</div>
  </div>
  <div class="ob-div"></div>

  <!-- Score Visita -->
  <div class="ob-seg score" id="seg-score-b">
    <div class="score-num" id="score-b">0</div>
    <div class="score-hint"><span>▲ sube</span><span>▼ baja</span></div>
  </div>
  <div class="ob-div"></div>

  <!-- Nombre Visita -->
  <div class="ob-seg name" id="seg-visit">
    <div class="name-text" id="name-b">VISITA</div>
    <div class="name-hint">mantén presionado para editar</div>
  </div>
  <div class="ob-div"></div>

  <!-- Faltas Visita -->
  <div class="ob-seg foul" id="seg-foul-b">
    <div class="foul-num" id="foul-b">0</div>
    <div class="foul-lbl">faltas</div>
    <div class="foul-arrows"><span>▲</span><span>▼</span></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">Editar equipo</h2>
    <div class="field-group">
      <label>Nombre del equipo</label>
      <input type="text" id="modal-name" maxlength="20" placeholder="Nombre">
    </div>
    <div class="field-group">
      <label>Color del uniforme</label>
      <div class="color-row" id="color-swatches"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn save" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<script>
const COLORS = [
  '#ffffff','#e03030','#2060e0','#20a040',
  '#e8c020','#e07020','#444460','#8040c0',
  '#40a8e0','#e060a0','#00b894','#d63031'
];
const PERIOD_LABELS = ['1° CTO','2° CTO','3° CTO','4° CTO','PRÓRR 1','PRÓRR 2'];

const state = {
  a: { score:0, fouls:0, name:'LOCAL',  color:'#2060e0' },
  b: { score:0, fouls:0, name:'VISITA', color:'#e03030' },
  period: 1,
  overlayPos: 'bottom'
};

let modalTeam = null;

// ── CAMERA ──
async function startCamera() {
  const video = document.getElementById('camera');
  const errDiv = document.getElementById('cam-error');
  const errMsg = document.getElementById('cam-error-msg');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width:{ideal:1920}, height:{ideal:1080} },
      audio: false
    });
    video.srcObject = stream;
    errDiv.style.display = 'none';
  } catch(e) {
    video.style.display = 'none';
    errDiv.style.display = 'flex';
    errMsg.textContent = e.name === 'NotAllowedError'
      ? 'Permiso de cámara denegado. Habilitá el acceso en ajustes del navegador.'
      : 'Error al iniciar la cámara: ' + e.message;
  }
}

// ── TOUCH LOGIC ──
// Divide overlay into 7 zones by X position
// [0] foul-a  [1] name-a  [2] score-a  [3] period  [4] score-b  [5] name-b  [6] foul-b
// name zones do nothing on touch (they open modal on click)

function getZone(clientX) {
  const bar = document.getElementById('overlay-bar');
  const segs = [
    document.getElementById('seg-foul-a'),
    document.getElementById('seg-local'),
    document.getElementById('seg-score-a'),
    document.getElementById('seg-period'),
    document.getElementById('seg-score-b'),
    document.getElementById('seg-visit'),
    document.getElementById('seg-foul-b'),
  ];
  for (let i = 0; i < segs.length; i++) {
    const r = segs[i].getBoundingClientRect();
    if (clientX >= r.left && clientX <= r.right) return i;
  }
  // fallback: left half = score-a, right half = score-b
  return clientX < window.innerWidth / 2 ? 2 : 4;
}

function handleTap(isTop, clientX) {
  const delta = isTop ? 1 : -1;
  const zone  = getZone(clientX);

  // zones: 0=foul-a, 1=name-a(skip), 2=score-a, 3=period, 4=score-b, 5=name-b(skip), 6=foul-b
  switch(zone) {
    case 0: addFoul('a', delta);   break;
    case 1: addScore('a', delta);  break;
    case 2: addScore('a', delta);  break;
    case 3: changePeriod(delta);   break;
    case 4: addScore('b', delta);  break;
    case 5: addScore('b', delta);  break;
    case 6: addFoul('b', delta);   break;
  }
}
// Attach touch/click to zones
['touch-top','touch-bottom'].forEach(id => {
  const el = document.getElementById(id);
  const isTop = id === 'touch-top';

  el.addEventListener('click', e => {
    // if modal is open, ignore
    if (document.getElementById('modal-overlay').classList.contains('open')) return;
    // check if tap landed on UI buttons
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (target && target.closest('#ui-btns')) return;
    handleTap(isTop, e.clientX);
  });
});

// ── LONG PRESS ON NAMES ──
let longPressTimer = null;
const LONG_PRESS_MS = 500;

function setupLongPress(segId, team) {
  const el = document.getElementById(segId);

  function start(e) {
    e.preventDefault();
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      openModal(team);
    }, LONG_PRESS_MS);
  }

  function cancel() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  }

  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend',   cancel);
  el.addEventListener('touchmove',  cancel);
}

setupLongPress('seg-local', 'a');
setupLongPress('seg-visit', 'b');

// ── STATE ──
function clamp(v,mn,mx){ return Math.max(mn,Math.min(mx,v)); }
function addScore(t,d)  { state[t].score  = clamp(state[t].score +d, 0, 999); render(); }
function addFoul(t,d)   { state[t].fouls  = clamp(state[t].fouls +d, 0, 40);  render(); }
function changePeriod(d){ state.period    = clamp(state.period   +d, 1, 6);   render(); }

function confirmReset(){
  if(confirm('¿Resetear marcador y faltas? (El período se mantiene)')) {
    state.a.score=0; state.b.score=0;
    state.a.fouls=0; state.b.fouls=0;
    render();
  }
}

// ── RENDER ──
function render(){
  ['a','b'].forEach(t => {
    document.getElementById('score-'+t).textContent = state[t].score;
    document.getElementById('foul-'+t).textContent  = state[t].fouls;
    document.getElementById('name-'+t).textContent  = state[t].name.toUpperCase();
  });
  // colors via CSS custom props on overlay
  const bar = document.getElementById('overlay-bar');
  bar.style.setProperty('--color-a', state.a.color);
  bar.style.setProperty('--color-b', state.b.color);

  const p = state.period;
  document.getElementById('period-num').textContent = p;
  document.getElementById('period-lbl').textContent = PERIOD_LABELS[p-1] || ('PRÓRR '+(p-4));
}

// ── POSITION ──
function togglePosition(){
  state.overlayPos = state.overlayPos === 'bottom' ? 'top' : 'bottom';
  applyLayout();
}

function applyLayout(){
  const bar = document.getElementById('overlay-bar');
  if(state.overlayPos === 'top'){
    bar.style.top    = 'env(safe-area-inset-top, 0px)';
    bar.style.bottom = '';
    bar.classList.add('pos-top');
  } else {
    bar.style.bottom = 'env(safe-area-inset-bottom, 0px)';
    bar.style.top    = '';
    bar.classList.remove('pos-top');
  }
}

// ── FULLSCREEN ──
function toggleFullscreen(){
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

// ── MODAL ──
function buildSwatches(sel){
  const c = document.getElementById('color-swatches');
  c.innerHTML='';
  COLORS.forEach(hex => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch'+(hex===sel?' selected':'');
    sw.style.background = hex;
    sw.onclick = () => {
      c.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
    };
    c.appendChild(sw);
  });
}

function openModal(t){
  modalTeam = t;
  document.getElementById('modal-title').textContent =
    t==='a' ? 'Editar Equipo Local' : 'Editar Equipo Visita';
  document.getElementById('modal-name').value = state[t].name;
  buildSwatches(state[t].color);
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('modal-name').focus(),100);
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  modalTeam = null;
}

function rgbToHex(str){
  const m = str.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if(!m) return str;
  return '#'+[m[1],m[2],m[3]].map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');
}

function saveModal(){
  if(!modalTeam) return;
  const name = document.getElementById('modal-name').value.trim();
  if(name) state[modalTeam].name = name;
  const sel = document.querySelector('.color-swatch.selected');
  if(sel) state[modalTeam].color = rgbToHex(sel.style.background) || state[modalTeam].color;
  closeModal();
  render();
}

document.getElementById('modal-overlay').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});
document.getElementById('modal-name').addEventListener('keydown', e=>{
  if(e.key==='Enter') saveModal();
});

// ── INIT ──
startCamera();
render();
applyLayout();
</script>
</body>
</html>
